[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ushqyr-bench"
version = "0.1.0"
description = "Python SDK for the Ushqyr AI Bench drone simulator: sensors in, RC channels out"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21", "msgpack>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
examples = ["opencv-python>=4.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ushqyr_bench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
